name: iptv_flutter
description: "IPTV Application for Android TV and mobile"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  # Versiones sin el paso de native assets (exige un SDK sin espacios).
  flutter_secure_storage: ^9.2.4
  path_provider: 2.1.4
  video_player: ^2.9.2
  wakelock_plus: ^1.4.0

dependency_overrides:
  # path_provider_* recientes usan FFI/native assets vía objective_c/jni.
  path_provider_android: 2.2.22
  path_provider_foundation: 2.4.2
  # wakelock 1.5.2 (impuesto por win32 5.x) solo compila con iface 1.4.x.
  wakelock_plus_platform_interface: '>=1.4.0 <1.5.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: assets/app_logo.png
  image_path: assets/app_logo.png
  remove_alpha_ios: true

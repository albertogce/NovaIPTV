name: iptv_flutter
description: "IPTV Application for Android TV and mobile"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  video_player: ^2.9.2
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: assets/app_logo.png
  image_path: assets/app_logo.png
  remove_alpha_ios: true
